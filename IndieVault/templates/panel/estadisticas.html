{% extends 'panel/base_panel.html' %}
{% load static %}

{% block panel_content %}
<div class="stats-grid panel-stats">
    {% for chart in charts %}
        {% include 'panel/_chart_card.html' %}
    {% endfor %}
</div>

{{ charts|json_script:"chart-specs" }}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{% static 'js/stats-charts.js' %}"></script>
{% endblock %}
