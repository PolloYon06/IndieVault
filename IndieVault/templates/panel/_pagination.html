{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Paginación">
    {% if page_obj.has_previous %}
        <a class="button small ghost" href="{% querystring page=page_obj.previous_page_number %}">← Anterior</a>
    {% else %}
        <span></span>
    {% endif %}
    <span class="pagination-info">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="button small ghost" href="{% querystring page=page_obj.next_page_number %}">Siguiente →</a>
    {% else %}
        <span></span>
    {% endif %}
</nav>
{% endif %}
